<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>МТК 41 · Отбраковка силуэтов</title>
<!--
  Инструмент отбраковки и обрезки силуэтов. Открывать по http (fetch к json):
      http://127.0.0.1:8097/mtk41-triage/

  Что делает:
   · показывает фотографию и силуэт рядом — судить по силуэту в отрыве от
     снимка нельзя, половина брака видна только в сравнении;
   · три вердикта на объект: годен / брак / рисовать руками;
   · линия земли двигается прямо на силуэте, срез виден сразу.

  Обрезка режет ВЕКТОР через clipPath, а не растр: маски лежат вне
  репозитория, а путь уже нормирован по высоте (y от 0 до 1), так что линия
  земли — это просто число от 0 до 1. Его и сохраняем.

  Решения пишутся в localStorage на каждое нажатие — вкладку можно закрыть в
  любой момент. Кнопка «Скачать решения» отдаёт json, который я вливаю в
  silhouettes_manual.json.
-->
<style>
  :root{
    --paper:#F7F9EF; --brass:#D2B773; --red:#A02128;
    --ink:#14181a; --panel:#1b2023; --line:#2c3438; --dim:#8b969b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:18px;padding:12px 20px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink);z-index:5;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.02em}
  .grow{flex:1}
  button,select{font:inherit;color:var(--paper);background:#232a2e;
    border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer}
  button:hover{background:#2b3338}
  button.on{background:var(--brass);color:#1c2226;border-color:var(--brass);font-weight:600}
  .counts{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .counts b{color:var(--paper);font-weight:600}

  main{display:grid;grid-template-columns:1fr 300px;gap:20px;padding:20px;align-items:start}
  .stage{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px;min-height:60vh;display:flex;flex-direction:column}
  .box h2{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim);
    text-transform:uppercase;letter-spacing:.08em}
  .fitbox{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .fitbox img{max-width:100%;max-height:56vh;object-fit:contain;border-radius:4px}
  svg{max-width:100%;max-height:56vh}

  .meta{margin-bottom:14px}
  .meta .city{font-size:24px;font-weight:600;line-height:1.15}
  .meta .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .warn{color:var(--brass);font-size:13px;margin-top:6px}

  .verdicts{display:grid;gap:8px;margin:16px 0}
  .verdicts button{text-align:left;padding:11px 14px}
  .verdicts .k{color:var(--dim);float:right;font-size:12px}
  button.ok.on{background:#3f7d4f;border-color:#3f7d4f;color:#fff}
  button.bad.on{background:var(--red);border-color:var(--red);color:#fff}
  button.man.on{background:var(--brass);border-color:var(--brass);color:#1c2226}

  .cut label,.rot label{display:flex;justify-content:space-between;color:var(--dim);font-size:13px}
  .rot{margin:14px 0}
  .rotbtns{display:flex;gap:8px;margin-top:6px}
  .rotbtns button{flex:1;text-align:center}
  .crop{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;margin-top:8px}
  .crop span{color:var(--dim);font-size:12px;white-space:nowrap}
  .crop input{width:100%;margin:0}
  .side .hint{color:var(--dim);font-size:12px;line-height:1.5;margin-top:18px;
    border-top:1px solid var(--line);padding-top:12px}
  .side .hint kbd{background:#232a2e;border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font:12px/1 ui-monospace,monospace}
  .nav{display:flex;gap:8px;margin-top:14px}
  .nav button{flex:1;text-align:center}
  .strip{display:flex;gap:4px;overflow-x:auto;padding:10px 20px;border-top:1px solid var(--line)}
  .strip div{width:26px;height:26px;border-radius:4px;background:#232a2e;flex:0 0 auto;
    cursor:pointer;border:2px solid transparent}
  .strip div.ok{background:#3f7d4f}
  .strip div.bad{background:var(--red)}
  .strip div.man{background:var(--brass)}
  .strip div.cur{border-color:var(--paper)}
  .origin{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;
    border:1px solid var(--line);border-radius:5px;padding:4px 8px;white-space:nowrap}
  .origin.warn{color:#1c2226;background:var(--brass);border-color:var(--brass);font-weight:600}
  #err{padding:20px;color:var(--brass)}
</style>
</head>
<body>

<header>
  <h1>Отбраковка силуэтов</h1>
  <select id="filter">
    <option value="short">Сомнительные (короткий список)</option>
    <option value="all">Все подряд</option>
    <option value="todo">Ещё не размеченные</option>
    <option value="man">Помеченные «руками»</option>
  </select>
  <button id="mode">Заливка</button>
  <span class="grow"></span>
  <span class="counts" id="counts"></span>
  <span class="origin" id="origin" title="Разметка привязана к этому адресу"></span>
  <button id="save">Скачать решения</button>
</header>

<div id="err" hidden></div>
<main hidden id="app">
  <div class="stage">
    <div class="box"><h2>Фотография</h2><div class="fitbox" id="photo"></div></div>
    <div class="box"><h2>Силуэт</h2><div class="fitbox" id="sil"></div></div>
  </div>

  <div class="side">
    <div class="meta">
      <div class="city" id="city"></div>
      <div class="sub" id="sub"></div>
      <div class="warn" id="warn"></div>
    </div>

    <div class="verdicts">
      <button class="ok"  data-v="ok">Годен <span class="k">1</span></button>
      <button class="bad" data-v="bad">В брак <span class="k">2</span></button>
      <button class="man" data-v="man">Рисовать руками <span class="k">3</span></button>
    </div>

    <div class="rot">
      <label><span>Поворот снимка</span><span id="rotval">0°</span></label>
      <div class="rotbtns">
        <button id="rotl">↺ 90°</button>
        <button id="rotr">↻ 90°</button>
      </div>
    </div>

    <div class="cut">
      <label><span>Обрезка</span><span id="cutval">целиком</span></label>
      <div class="crop">
        <span>сверху</span><input type="range" id="cT" min="0" max="0.85" step="0.005" value="0" />
        <span>снизу</span><input type="range" id="cB" min="0.15" max="1" step="0.005" value="1" />
        <span>слева</span><input type="range" id="cL" min="0" max="0.85" step="0.005" value="0" />
        <span>справа</span><input type="range" id="cR" min="0.15" max="1" step="0.005" value="1" />
      </div>
      <button id="cutreset" style="width:100%;margin-top:8px">Вернуть целиком <span class="k">0</span></button>
    </div>

    <div class="nav">
      <button id="prev">← Назад</button>
      <button id="next">Вперёд →</button>
    </div>

    <div class="hint">
      <kbd>1</kbd> годен · <kbd>2</kbd> брак · <kbd>3</kbd> руками<br />
      <kbd>←</kbd> <kbd>→</kbd> листать · <kbd>0</kbd> снять обрезку<br />
      <kbd>[</kbd> <kbd>]</kbd> линия земли · <kbd>r</kbd> повернуть<br />
      Обрезка со всех сторон — ползунками.<br /><br />
      Решения сохраняются сами, вкладку можно закрыть.
    </div>
  </div>
</main>

<div class="strip" id="strip" hidden></div>

<script>
/* ── данные ─────────────────────────────────────────────────────────── */
const KEY = "mtk41-triage-v1";
const S = { list: [], i: 0, mode: "fill", d: {} };

try { S.d = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { S.d = {}; }
S.seenBefore = localStorage.getItem(KEY + "-seen") === "1";
localStorage.setItem(KEY + "-seen", "1");

const $ = (id) => document.getElementById(id);

/* Обрезка хранится как рамка в долях: t/b по высоте, l/r по ширине силуэта.
 * Старые решения писали одну нижнюю линию полем `cut` — читаем и её, чтобы
 * уже сделанная разметка не пропала. */
function cropOf(rec) {
  const c = rec.crop || {};
  return {
    t: c.t == null ? 0 : c.t,
    b: c.b == null ? (rec.cut == null ? 1 : rec.cut) : c.b,
    l: c.l == null ? 0 : c.l,
    r: c.r == null ? 1 : c.r,
  };
}
const isWhole = (c) => c.t === 0 && c.b === 1 && c.l === 0 && c.r === 1;

/* Пунктирная линия реза — чтобы было видно, где именно режется. */
function edge(on, x1, y1, x2, y2) {
  return on ? '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="var(--red)" stroke-width="0.004" stroke-dasharray="0.02 0.02"/>' : "";
}
const V = "?v=34";

Promise.all([
  fetch("../data/mtk41.json" + V).then((r) => r.json()),
  fetch("../assets/mtk41/silhouettes_paths.json" + V).then((r) => r.json()),
  fetch("../assets/mtk41/thumbs.json" + V).then((r) => r.json()),
  fetch("../assets/mtk41/heights.json" + V).then((r) => r.json()),
]).then(([corpus, paths, thumbs, heights]) => {
  const byId = {};
  for (const m of corpus.items) byId[m.id] = m;

  S.all = Object.entries(paths.items).map(([id, p]) => {
    const m = byId[id] || {};
    const h = heights[id] || null;
    /* Те же два признака, которыми я сузил 269 до 30: «лежачий» силуэт и
     * бедный контур. Метрика мягче глаза, поэтому она только сортирует
     * очередь — решает всё равно человек. */
    const pts = (p.d.match(/L/g) || []).length + (p.d.match(/M/g) || []).length;
    return {
      id, d: p.d, ar: p.ar, pts, m, h,
      thumb: thumbs[id] ? "../assets/mtk41/" + id + "/" + thumbs[id] : null,
      suspect: p.ar > 1.15 || pts < 28,
    };
  }).sort((a, b) => (b.suspect - a.suspect) || (a.pts - b.pts));

  build();
  $("app").hidden = false;
  $("strip").hidden = false;
  render();
}).catch((e) => {
  $("err").hidden = false;
  $("err").textContent = "Не удалось загрузить данные: " + e.message +
    ". Инструмент нужно открывать по http, а не файлом с диска.";
});

/* ── список по фильтру ──────────────────────────────────────────────── */
function build() {
  const f = $("filter").value;
  const keep = (o) => f === "all" ? true
    : f === "short" ? o.suspect
    : f === "todo" ? !S.d[o.id]
    : (S.d[o.id] || {}).v === "man";
  S.list = S.all.filter(keep);
  if (S.i >= S.list.length) S.i = Math.max(0, S.list.length - 1);
  buildStrip();
}

function buildStrip() {
  const el = $("strip");
  el.innerHTML = "";
  S.list.forEach((o, k) => {
    const d = document.createElement("div");
    const v = (S.d[o.id] || {}).v;
    if (v) d.className = v;
    if (k === S.i) d.className += " cur";
    d.title = (o.m.city || o.id) + (v ? " — " + v : "");
    d.onclick = () => { S.i = k; render(); };
    el.appendChild(d);
  });
}

/* ── отрисовка ──────────────────────────────────────────────────────── */
function render() {
  const o = S.list[S.i];
  if (!o) { $("city").textContent = "Пусто в этом фильтре"; $("sil").innerHTML = ""; $("photo").innerHTML = ""; return; }
  const rec = S.d[o.id] || {};
  const c = cropOf(rec);
  const rot = rec.rot || 0;

  /* Поворот показываем сразу на обоих: судить о снимке, лежащем на боку,
   * невозможно. Сам файл поворачивается потом, в пайплайне, и силуэт для
   * него пересчитывается заново — здесь это только предпросмотр. */
  $("photo").innerHTML = o.thumb
    ? '<img src="' + o.thumb + '" alt="" style="transform:rotate(' + rot + 'deg)" />'
    : '<span style="color:var(--dim)">снимка нет</span>';

  /* Обрезка — clipPath по вектору: путь уже нормирован по высоте, поэтому
   * линия земли это просто y от 0 до 1, никакой возни с растром. */
  /* Обрезка — прямоугольник clipPath по ЧЕТЫРЁМ сторонам. Одной нижней
   * линии не хватало: у Котки постамент уходит влево далеко за бюст, и
   * горизонтальный рез его не трогает вовсе. */
  const cid = "clip" + S.i;
  const x0 = c.l * o.ar, x1 = c.r * o.ar;
  $("sil").innerHTML =
    '<svg viewBox="0 0 ' + o.ar + ' 1" preserveAspectRatio="xMidYMid meet" ' +
      'style="width:100%;height:56vh;transform:rotate(' + rot + 'deg)">' +
    '<defs><clipPath id="' + cid + '">' +
      '<rect x="' + x0 + '" y="' + c.t + '" width="' + (x1 - x0) +
      '" height="' + (c.b - c.t) + '"/>' +
    '</clipPath></defs>' +
    '<path d="' + o.d + '" clip-path="url(#' + cid + ')" ' +
      (S.mode === "fill"
        ? 'fill="var(--paper)" fill-rule="evenodd"'
        : 'fill="none" stroke="var(--brass)" stroke-width="0.006"') + '/>' +
    edge(c.t > 0, 0, c.t, o.ar, c.t) +
    edge(c.b < 1, 0, c.b, o.ar, c.b) +
    edge(c.l > 0, x0, 0, x0, 1) +
    edge(c.r < 1, x1, 0, x1, 1) +
    "</svg>";

  $("city").textContent = o.m.city || o.id;
  const hh = o.h ? ((o.h.statue || 0) + (o.h.pedestal || 0)) : null;
  $("sub").textContent = [
    o.m.year || "год ?",
    o.m.kind || "?",
    hh ? hh.toFixed(1) + " м" : "высота неизвестна",
    o.m.country || "",
  ].filter(Boolean).join(" · ");

  const w = [];
  if (o.ar > 1.15) w.push("силуэт шире, чем выше (" + o.ar.toFixed(2) + ")");
  if (o.pts < 28) w.push("бедный контур: " + o.pts + " точек");
  $("warn").textContent = w.length ? "⚠ " + w.join("; ") : "";

  for (const b of document.querySelectorAll(".verdicts button")) {
    b.classList.toggle("on", b.dataset.v === rec.v);
  }
  $("cT").value = c.t; $("cB").value = c.b; $("cL").value = c.l; $("cR").value = c.r;
  $("rotval").textContent = rot + "°";
  const parts = [];
  if (c.t > 0) parts.push("сверху " + Math.round(c.t * 100) + "%");
  if (c.b < 1) parts.push("снизу " + Math.round((1 - c.b) * 100) + "%");
  if (c.l > 0) parts.push("слева " + Math.round(c.l * 100) + "%");
  if (c.r < 1) parts.push("справа " + Math.round((1 - c.r) * 100) + "%");
  $("cutval").textContent = parts.length ? parts.join(", ") : "целиком";

  const n = S.all.length;
  const done = Object.values(S.d).filter((x) => x.v).length;

  /* Адрес на виду — не украшение. localStorage привязан к origin: разметка,
   * начатая на 127.0.0.1:8097, НЕ видна на localhost:8092, это для браузера
   * разные хранилища. Человек, открывший вторую вкладку и увидевший нули,
   * иначе решит, что работа пропала. Здесь он сразу видит, где находится. */
  const org = $("origin");
  org.textContent = location.host;
  org.classList.toggle("warn", done === 0 && S.seenBefore);
  const cnt = (v) => Object.values(S.d).filter((x) => x.v === v).length;
  $("counts").innerHTML = "объект <b>" + (S.i + 1) + "</b> из <b>" + S.list.length +
    "</b> · размечено <b>" + done + "</b> из " + n +
    " · годных " + cnt("ok") + ", брак " + cnt("bad") + ", руками " + cnt("man");

  buildStrip();
}

/* ── действия ───────────────────────────────────────────────────────── */
function save() { localStorage.setItem(KEY, JSON.stringify(S.d)); }

function setVerdict(v) {
  const o = S.list[S.i];
  if (!o) return;
  const rec = S.d[o.id] || (S.d[o.id] = {});
  rec.v = rec.v === v ? undefined : v;      // повторное нажатие снимает
  if (!rec.v) delete rec.v;
  save();
  render();
  if (v !== "man") step(1);                 // «руками» оставляет на месте — вдруг ещё и подрезать
}

function setCrop(side, val) {
  const o = S.list[S.i];
  if (!o) return;
  const rec = S.d[o.id] || (S.d[o.id] = {});
  const c = cropOf(rec);
  c[side] = Math.round(val * 1000) / 1000;
  /* Стороны не должны пересекаться: иначе рамка вывернется и силуэт пропадёт
   * без внятной причины. */
  if (c.t > c.b - 0.05) { if (side === "t") c.t = c.b - 0.05; else c.b = c.t + 0.05; }
  if (c.l > c.r - 0.05) { if (side === "l") c.l = c.r - 0.05; else c.r = c.l + 0.05; }
  delete rec.cut;                       // старое поле больше не ведём
  if (isWhole(c)) delete rec.crop; else rec.crop = c;
  save();
  render();
}

function resetCrop() {
  const o = S.list[S.i];
  if (!o) return;
  const rec = S.d[o.id] || (S.d[o.id] = {});
  delete rec.crop; delete rec.cut;
  save();
  render();
}

function rotate(step) {
  const o = S.list[S.i];
  if (!o) return;
  const rec = S.d[o.id] || (S.d[o.id] = {});
  const next = (((rec.rot || 0) + step) % 360 + 360) % 360;
  if (next) rec.rot = next; else delete rec.rot;
  save();
  render();
}

function step(k) {
  if (!S.list.length) return;
  S.i = Math.min(S.list.length - 1, Math.max(0, S.i + k));
  render();
}

for (const b of document.querySelectorAll(".verdicts button")) {
  b.onclick = () => setVerdict(b.dataset.v);
}
for (const [id, side] of [["cT", "t"], ["cB", "b"], ["cL", "l"], ["cR", "r"]]) {
  $(id).oninput = (e) => setCrop(side, parseFloat(e.target.value));
}
$("cutreset").onclick = resetCrop;
$("rotl").onclick = () => rotate(-90);
$("rotr").onclick = () => rotate(90);
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("filter").onchange = () => { S.i = 0; build(); render(); };
$("mode").onclick = () => {
  S.mode = S.mode === "fill" ? "outline" : "fill";
  $("mode").textContent = S.mode === "fill" ? "Заливка" : "Обрисовка";
  render();
};

$("save").onclick = () => {
  const out = { _comment: "Решения отбраковки силуэтов МТК 41. crop — рамка обрезки в долях силуэта: t/b по высоте, l/r по ширине, режется всё вне рамки. rot — поворот снимка в градусах по часовой; снимок поворачивается физически, силуэт после этого пересчитывается заново.", _date: new Date().toISOString().slice(0, 10), items: S.d };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mtk41-triage.json";
  a.click();
};

addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.type === "range") return;
  const o = S.list[S.i];
  if (e.key === "1") setVerdict("ok");
  else if (e.key === "2") setVerdict("bad");
  else if (e.key === "3") setVerdict("man");
  else if (e.key === "0") resetCrop();
  else if (e.key === "r") rotate(e.shiftKey ? -90 : 90);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if ((e.key === "[" || e.key === "]") && o) {
    const c = cropOf(S.d[o.id] || {});
    setCrop("b", Math.min(1, Math.max(0.15, c.b + (e.key === "[" ? -0.01 : 0.01))));
  } else return;
  e.preventDefault();
});
</script>
</body>
</html>
