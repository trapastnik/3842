<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>МТК 38 · Ленин на языках мира</title>
    <!-- ?v=N обязателен: Chrome кеширует агрессивно, без версии правка не доедет до киоска. -->
    <link rel="stylesheet" href="../assets/shared/kiosk/kiosk.css?v=3" />
    <link rel="stylesheet" href="../assets/shared/kiosk/kiosk-core.css?v=3" />
    <!-- Шрифты бренда + 32 письменности Noto: без них не-латиница уходит в тофу. -->
    <link rel="stylesheet" href="../mtk38-v3/fonts/faces.css?v=2" />
    <link rel="stylesheet" href="./styles.css?v=4" />
    <!-- Three r184 вендорен локально (офлайн-киоск, без рантайм-CDN).
         Карта импортов нужна и статическим, и динамическим import('three'):
         сцены грузят движок лениво, только когда до них доходит очередь. -->
    <script type="importmap">
      {
        "imports": {
          "three": "../mtk38-v3/vendor/three/build/three.webgpu.js",
          "three/webgpu": "../mtk38-v3/vendor/three/build/three.webgpu.js",
          "three/tsl": "../mtk38-v3/vendor/three/build/three.tsl.js",
          "three/addons/": "../mtk38-v3/vendor/three/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- Канон проекции (COORDINATION 2026-07-08) — классический скрипт,
         подключается ДО модуля, чтобы window.MtkProjection был готов. -->
    <script src="../assets/shared/lib/projection.js?v=1"></script>
    <!-- Единый призыв к жесту (тач-стандарт, п. 4): window.KioskHint. -->
    <script src="../assets/shared/kiosk/hint.js?v=1"></script>
    <!-- Слой цитат Ленина (window.Quotes) — переиспользуемый модуль из V2.
         Классический скрипт: свой CSS он подключает сам, по собственному src. -->
    <script src="../mtk38-v2/shared/quotes.js?v=1"></script>
    <!-- Разметку строит ядро: подложка, слои сцен, навигация, сплэш, сервис-панель. -->
    <!-- Стенд приёмки (PLAN-KIOSK, фаза 4): KioskSelfTest.run(mtk38App).
         Подключается только по ?service=1 — на стенде посетителя его нет. -->
    <script>
      if (new URLSearchParams(location.search).has("service")) {
        document.write('<script src="../assets/shared/kiosk/tools/selftest.js?v=1"><\/script>');
      }
    </script>
    <script type="module" src="./app.js?v=14"></script>
  </body>
</html>
